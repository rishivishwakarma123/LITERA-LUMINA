# Development database: an in-memory H2 database starts empty on every launch.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.admin.username=${LITERA_ADMIN_USERNAME:rishi}
app.admin.password=${LITERA_ADMIN_PASSWORD:}
app.cors.allowed-origin=${LITERA_FRONTEND_ORIGIN:http://localhost:5173}
app.payment.upi-receiver-phone=${LITERA_UPI_RECEIVER_PHONE:7905873589}
app.checkout.tax-rate=${LITERA_TAX_RATE:0.05}
app.upload.directory=${LITERA_UPLOAD_DIRECTORY:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB